name: Source and prototype checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - name: Reject generated and intermediate files
        run: python SRS工作文件/check_repo.py
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate JavaScript syntax
        run: pnpm run check
      - name: Install test browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run offline prototype interactions
        run: pnpm test
